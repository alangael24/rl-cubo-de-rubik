# Configuracion PufferLib para Cubo de Rubik
# Basado en DeepCubeA y Autodidactic Iteration (ADI)

[base]
package = rubiks_cube
env_name = rubiks_cube
policy_name = Policy
rnn_name = Recurrent

[vec]
backend = Multiprocessing
num_envs = 4
num_workers = 4
batch_size = 1
zero_copy = True
seed = 42

[env]
# Numero de entornos internos por worker
num_envs = 1024
# Movimientos de scramble inicial (curriculum learning empieza en 1)
scramble_moves = 1
# Maximo de pasos por episodio
max_steps = 50
# Modo de recompensa: 'sparse' (recomendado) o 'dense'
reward_mode = sparse

[policy]
# Tamano de capas ocultas
hidden_size = 512
# Numero de bloques residuales
num_residual_blocks = 4

[rnn]
input_size = 512
hidden_size = 512

[train]
name = rubiks_cube
project = rubiks_rl

seed = 42
torch_deterministic = True
device = cuda
total_timesteps = 50_000_000
learning_rate = 0.0003
anneal_lr = True
gamma = 0.99
gae_lambda = 0.95
update_epochs = 4
clip_coef = 0.2
vf_coef = 0.5
max_grad_norm = 0.5
ent_coef = 0.01

data_dir = experiments
checkpoint_interval = 100
minibatch_size = 4096
bptt_horizon = 16

# Curriculum Learning settings (manejado externamente)
# start_scramble = 1
# max_scramble = 20
# success_threshold = 0.8
# steps_per_level = 1_000_000
