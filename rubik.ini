# Configuracion para entrenamiento de Cubo de Rubik con Curriculum Learning
# Basado en recomendaciones de DeepCubeA y Autodidactic Iteration (ADI)

[curriculum]
# Scramble moves inicial (empezar facil)
start_scramble = 1
# Scramble moves maximo (God's number = 20)
max_scramble = 20
# Tasa de exito requerida para avanzar al siguiente nivel
success_threshold = 0.8
# Ventana de episodios para evaluar exito
eval_window = 100
# Minimo de pasos antes de poder avanzar de nivel
steps_per_level = 50000

[env]
# Maximo de pasos por episodio (scramble_moves * 2 es una buena heuristica)
max_steps = 50
# Modo de recompensa: 'sparse' (recomendado) o 'dense'
reward_mode = sparse
# Recompensa por resolver el cubo
solve_reward = 1.0
# Penalizacion por cada paso (incentiva soluciones cortas)
step_penalty = 0.01

[train]
total_timesteps = 10_000_000
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
update_epochs = 4
clip_coef = 0.2
vf_coef = 0.5
ent_coef = 0.01
max_grad_norm = 0.5
batch_size = 2048
minibatch_size = 512
anneal_lr = true

[vec]
num_envs = 64
num_workers = 2
